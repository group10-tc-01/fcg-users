apiVersion: batch/v1
kind: Job
metadata:
  name: sqlserver-init
  namespace: fcg-system
  labels:
    app.kubernetes.io/name: sqlserver-init
    app.kubernetes.io/component: database
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlserver-init
        app.kubernetes.io/component: database
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-database
          image: mcr.microsoft.com/mssql/server:2022-latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
                SQLCMD=/opt/mssql-tools18/bin/sqlcmd
                TRUST_ARG=-C
              else
                SQLCMD=/opt/mssql-tools/bin/sqlcmd
                TRUST_ARG=
              fi

              echo "Waiting for SQL Server..."
              for attempt in $(seq 1 60); do
                if "$SQLCMD" -S sqlserver-service -U sa -P "$SA_PASSWORD" $TRUST_ARG -Q "SELECT 1" >/dev/null 2>&1; then
                  echo "SQL Server is ready."
                  break
                fi

                if [ "$attempt" -eq 60 ]; then
                  echo "SQL Server did not become ready in time."
                  exit 1
                fi

                sleep 5
              done

              "$SQLCMD" -S sqlserver-service -U sa -P "$SA_PASSWORD" $TRUST_ARG -Q "IF DB_ID(N'fcg_user') IS NULL CREATE DATABASE [fcg_user];"
              echo "Database fcg_user is ready."
          env:
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcg-users-local-secrets
                  key: sqlserver-sa-password

