apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fcg-users-secrets
  namespace: fcg-users
  labels:
    app.kubernetes.io/name: fcg-users
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "__AKS_KEYVAULT_CLIENT_ID__"
    keyvaultName: "__KEY_VAULT_NAME__"
    tenantId: "__AZURE_TENANT_ID__"
    objects: |
      array:
        - |
          objectName: sql-connection-users
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
        - |
          objectName: eventhub-connection
          objectType: secret
  secretObjects:
    - secretName: fcg-users-secrets
      type: Opaque
      data:
        - objectName: sql-connection-users
          key: ConnectionStrings__DefaultConnection
        - objectName: jwt-secret-key
          key: JwtSettings__SecretKey
        - objectName: eventhub-connection
          key: KafkaSettings__SaslPassword
